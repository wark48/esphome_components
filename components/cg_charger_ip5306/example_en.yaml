# 1. Connecting an external component from GitHub
external_components:
  - source:
      type: git
      url: https://github.com/wark48/esphome_components
      # ref: main  # if need
    components: [cg_charger_ip5306]
    # refresh: 1h # optional

# 2. I2C setting
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

# 3. Main component: management of all registers
cg_charger_ip5306:
  id: cg_charger_ip
  address: 0x75   # 7-bit adress 0xEA
  # Battery charging current (register CHG_DIG_CTL0 – 0x24, bits 4:0)
  # Range: 0.05 … 2.1 A (maximum battery charging current – 2.1 A).
  charging_current: 0.6 # Ampere

  # ================= SYS_CTL0 – 0x00 =================
  # Bit 5: Boost Converter Enable
  # false - 0: Disabled
  # true  - 1: Enabled
  # Default: true
  # Note: "After powering down, the IP5306 cannot automatically enter low-power mode
  # To power down and enter sleep mode, you must
  # send a double pulse using the button."
  boost_mode: true

  # Bit 4: Charge Management (charger_en)
  # false - 0: Disabled
  # true  - 1: Enabled
  # Default: true
  # Note: "After charging is complete and the battery is fully charged, if a power source is connected, charging can be re-enabled by
  # cycling states: enabled, disabled, and enabled, without disconnecting the input power."
  charger_mode: true

  # Bit 2: Enable automatic power-on when a load is connected
  # false - 0: Disabled
  # true  - 1: Enabled
  # Default: true
  power_on_load: true

  # Bit 1: BOOST pin always on
  # false - 0: Disabled
  # true. - 1: Enabled
  # Default: true
  boost_always_on: true

  # Bit 0: Enable button-based shutdown function
  # false - 0: Disabled
  # true  - 1: Enabled
  # Default: false
  button_shutdown_enable: false

  # ================= SYS_CTL1 – 0x01 =================
  # Bit 7: Selecting the control signal to disable the boost converter
  # true  - 1: Long press of the button
  # false - 0: Double press of the button
  # Default: false
  boost_shutdown_long_press: false

  # Bit 6: Select control signal for turning the WLED light on/off
  # true. - 1: Double-click the button
  # false - 0: Long press the button
  # Default: false
  led_double_press: false

  # Bit 5: Boost Converter On/Off Control Selection Short Press
  # false - 0: Disabled
  # true  - 1: Enabled
  # Default: false
  short_press_boost: false

  # Bit 2: After disconnecting VIN, select whether to enable/disable the boost converter (Boost)
  # false - 0: Disable
  # true  - 1: Enable
  # Default: true
  boost_after_vin: true

  # Bit 0: Enables the low battery shutdown function (Batlow) 3.0V
  # false - 0: Disabled
  # true  - 1: Enabled
  # Default: true
  low_battery_shutdown: true

  # ================= SYS_CTL2 – 0x02 (стр. 5) =================
  # Бит 4: Настройка времени длительного удержания кнопки (KEY)
  #   0: 2 секунды
  #   1: 3 секунды
  #   Дефолт: 0
  long_press_time_3s: false

  # Bits 3:2: Setting the automatic shutdown time in low-power mode
  # 3 - 11: 64 seconds
  # 2 - 10: 16 seconds
  # 1 - 01: 32 seconds
  # 0 - 00: 8 seconds
  # Default: 0
  # NOTE: The values ​​are nonlinear (01=32 seconds, 10=16 seconds).  
  light_load_shutdown_time: 0   # 0=8s, 1=32s, 2=16s, 3=64s

  # ================= Charger_CTL0 – 0x20 =================
  # Bits 1:0: Sets the stop charging voltage at full charge
  # 3 - 11: 4.2 / 4.305 / 4.35 / 4.395 V
  # 2 - 10: 4.185 / 4.29 / 4.335 / 4.38 V
  # 1 - 01: 4.17 / 4.275 / 4.32 / 4.365 V
  # 0 - 00: 4.14 / 4.26 / 4.305 / 4.35 V
  # Default: 1
  # Note: "It is recommended to use modes 01 or 00 for best results."
  charging_stop_voltage: 1  # 0..3; 0 or 1 recommended

  # ================= Charger_CTL1 – 0x21 =================
  # Bits 7:6: Setting the battery-side current detection when stopping charging
  # 3 - 11: 600 mA
  # 2 - 10: 500 mA
  # 1 - 01: 400 mA
  # 0 - 00: 200 mA
  # Default: 1
  # Note: "The IP5306 first checks the current and then checks the battery voltage
  # when detecting a full charge."
  end_charge_current: 1 # 0=200 mA, 1=400 mA, 2=500 mA, 3=600 mA

  # Bits 4:2: Setting the undervoltage level during charging (VOUT)
  # 7 - 111: 4.8V | 6 - 110: 4.75V | 5 - 101: 4.7V | 4 - 100: 4.65V
  # 3 - 011: 4.6V | 2 - 010: 4.55V | 1 - 001: 4.5V | 0 - 000: 4.45V
  # Default: 5 (4.7V)
  # Note: "During charging, the IC will monitor the voltage at the VOUT output
  # to automatically adjust the charging current. When the VOUT voltage
  # exceeds the set value, charging will be performed with the maximum
  # current. When the VOUT voltage is below the set value, the charging current
  # will automatically decrease to maintain this voltage."
  charger_under_voltage: 5 # 0 = 4.45V … 7 = 4.8V, 50mV steps

  # ================= Charger_CTL2 – 0x22 =================
  # Биты 3:2: Настройка уровня напряжения батареи
  #   11: 4.4 В
  #   10: 4.35 В
  #   01: 4.3 В
  #   00: 4.2 В
  #   Дефолт: 00
  battery_voltage: 0   # 0=4.2В, 1=4.3В, 2=4.35В, 3=4.4В

  # Биты 1:0: Настройка уровня дополнительного напряжения для постоянного
  #           напряжения зарядки
  #   11: +42 мВ
  #   10: +28 мВ
  #   01: +14 мВ
  #   00: без дополнительного напряжения
  #   Дефолт: 01
  #   Примечание: "Рекомендуется использовать дополнительное напряжение +14 мВ
  #   для уровней 4.30 В, 4.35 В и 4.4 В. Рекомендуется использовать
  #   дополнительное напряжение +28 мВ для уровня 4.2 В."
  voltage_pressure: 1   # 0=0мВ, 1=+14мВ, 2=+28мВ, 3=+42мВ

  # ================= Charger_CTL3 – 0x23 (стр. 7) =================
  # Бит 5: Выбор петли постоянного тока зарядки
  #   1: Петля постоянного тока на входе VIN (CC)
  #   0: Петля постоянного тока на батарее (BAT) (CC)
  #   Дефолт: 1
  cc_loop_vin: true

# 4. Чтение статусов через бинарные сенсоры
# Даташит (стр. 3): "Используйте бит 3 регистра с адресом 0x70 для определения
# состояния IP5306 (заряд или разряд): bit3=1 означает заряд, bit3=0 означает разряд."
# Однако в карте регистров (стр. 7) бит 3 регистра 0x70 — это charge_en
# (флаг разрешения зарядки), а не факт протекания тока.
# Даташит (стр. 3): "Используйте бит 3 регистра с адресом 0x71 для определения
# состояния заряда батареи: bit3=1 означает полный заряд, bit3=0 означает неполный заряд."
binary_sensor:
  # Регистр REG_READ0 – 0x70, бит 3: charge_en (флаг разрешения зарядки)
  #   1: Зарядка включена
  #   0: Зарядка выключена
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: charge_enabled
    name: "IP5306 Charge Enabled"

  # Регистр REG_READ1 – 0x71, бит 3: флаг полного заряда
  #   0: В процессе зарядки
  #   1: Полностью заряжено
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: charge_complete
    name: "IP5306 Charge Complete"

  # Регистр REG_READ2 – 0x72, бит 2: флаг лёгкой нагрузки на выходе
  #   0: Мощная нагрузка
  #   1: Лёгкая нагрузка
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: light_load
    name: "IP5306 Light Load"

  # Регистр REG_READ3 – 0x77, бит 0: флаг короткого нажатия на кнопку KEY
  #   1: Произведено короткое нажатие
  #   0: Нет короткого нажатия
  #   Тип: R/W. Сброс — "Write 1 Cleared" (записать 1 в бит).
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: short_press
    name: "IP5306 Short Press"

  # Регистр REG_READ3 – 0x77, бит 1: флаг длительного нажатия на кнопку KEY
  #   1: Произведено длительное нажатие
  #   0: Нет длительного нажатия
  #   Тип: R/W. Сброс — "Write 1 Cleared".
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: long_press
    name: "IP5306 Long Press"

  # Регистр REG_READ3 – 0x77, бит 2: флаг двойного нажатия на кнопку KEY
  #   1: Произведено двойное нажатие
  #   0: Нет двойного нажатия
  #   Тип: R/W. Сброс — "Write 1 Cleared".
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: double_press
    name: "IP5306 Double Press"

# 5. Уровень заряда (недокументированный регистр 0x78)
# В даташите CG Charger IP регистр 0x78 отсутствует (последний описанный — 0x77).
# Однако регистр стабильно работает и широко используется:
#   - ESP32Marauder: тот же маппинг & 0xF0
#   - AvinasheeTech/IP5306_I2C: список регистров
# Даташит (стр. 3) предупреждает: "IP5306 не имеет информации о напряжении и токе,
# поэтому для управления зарядом батареи необходимо использовать внешний
# контроллер с АЦП". Регистр 0x78 — исключение (дискретные уровни 25/50/75/100%).
sensor:
  - platform: template
    name: "IP5306 Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    update_interval: 60s
    lambda: |-
      uint8_t level = id(cg_charger_ip).get_battery_level();
      if (level == 255) return NAN;
      return (float) level;
