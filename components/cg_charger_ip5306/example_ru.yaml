# 1. Подключение внешнего компонента с GitHub
external_components:
  - source:
      type: git
      url: https://github.com/wark48/esphome_components
      # ref: main  # при необходимости укажите ветку/тег
    components: [cg_charger_ip5306]
    refresh: 1h

# 2. Настройка шины I2C
# Даташит (стр. 3): "Для работы I2C линии необходима внешняя подтяжка на мастер устройстве.
# Скорость i2c поддерживает 400 Кбит/с. Поддерживается ширина адреса 8 бит и ширина данных 8 бит.
# Передача и прием происходят сначала старшим битом (MSB). Адрес устройства по умолчанию – 0xEA."
# В ESPHome используется 7-битный адрес: 0xEA >> 1 = 0x75.
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 400kHz

# 3. Основной компонент: управление всеми регистрами
cg_charger_ip5306:
  id: cg_charger_ip
  address: 0x75   # 7-битный адрес (в даташите 0xEA — 8-битная запись)

  # Ток заряда АКБ (регистр CHG_DIG_CTL0 – 0x24, биты 4:0)
  # Даташит (стр. 7): "I = 0.05 + b0*0.1 + b1*0.2 + b2*0.4 + b3*0.8 + b4*1.6 А"
  # Диапазон: 0.05 … 2.1 A (максимальный ток заряда АКБ – 2.1 А, стр. 3).
  # Пример: b0=1, b1=0, b2=1, b3=1, b4=0 → I = 0.05 + 0.1 + 0.4 + 0.8 = 1.35 А.
  charging_current: 0.6

  # ================= SYS_CTL0 – 0x00 (стр. 4) =================
  # Бит 5: Включение повышающего преобразователя (Boost)
  #   0: отключено
  #   1: включено
  #   Дефолт: 1
  #   Примечание: "После отключения IP5306 не может автоматически перейти в режим
  #   низкого потребления. Для выключения и перехода в режим сна необходимо
  #   отправить двойной импульс с помощью кнопки."
  boost_mode: true

  # Бит 4: Управление зарядом (charger_en)
  #   0: отключено
  #   1: включено
  #   Дефолт: 1
  #   Примечание: "После завершения зарядки при полном заряде, при наличии
  #   подключенного источника питания, можно повторно включить зарядку,
  #   изменяя состояния: включить - отключить - включить, не отключая входное питание."
  charger_mode: true

  # Бит 2: Включение функции автоматического включения при подключении нагрузки
  #   0: отключено
  #   1: включено
  #   Дефолт: 1
  power_on_load: true

  # Бит 1: BOOST вывод постоянно включен
  #   0: отключено
  #   1: включено
  #   Дефолт: 1
  boost_always_on: true

  # Бит 0: Включение функции выключения по кнопке
  #   0: отключено
  #   1: включено
  #   Дефолт: 0
  button_shutdown_enable: true

  # ================= SYS_CTL1 – 0x01 (стр. 4–5) =================
  # Бит 7: Выбор сигнала управления для выключения повышающего преобразователя (boost)
  #   1: Длительное удержание кнопки
  #   0: Двойное нажатие кнопки
  #   Дефолт: 0
  boost_shutdown_long_press: false

  # Бит 6: Выбор сигнала управления для включения/выключения фонаря WLED
  #   1: Двойное нажатие кнопки
  #   0: Длительное удержание кнопки
  #   Дефолт: 0
  led_double_press: false

  # Бит 5: Выбор управления включением/выключением повышающего преобразователя
  #        при коротком нажатии
  #   0: Отключено
  #   1: Включено
  #   Дефолт: 0
  short_press_boost: false

  # Бит 2: После отключения VIN, выбор включения/выключения повышающего
  #        преобразователя (Boost)
  #   0: Не включать
  #   1: Включить
  #   Дефолт: 1
  boost_after_vin: true

  # Бит 0: Включение функции выключения при низком уровне заряда батареи (Batlow) 3.0V
  #   0: Отключено
  #   1: Включено
  #   Дефолт: 1
  low_battery_shutdown: true

  # ================= SYS_CTL2 – 0x02 (стр. 5) =================
  # Бит 4: Настройка времени длительного удержания кнопки (KEY)
  #   0: 2 секунды
  #   1: 3 секунды
  #   Дефолт: 0
  long_press_time_3s: false

  # Биты 3:2: Настройка времени автоматического выключения в режиме низкого потребления
  #   11: 64 секунды
  #   10: 16 секунд
  #   01: 32 секунды
  #   00: 8 секунд
  #   Дефолт: 00
  #   ВНИМАНИЕ: значения нелинейны (01=32с, 10=16с).
  light_load_shutdown_time: 0   # 0=8с, 1=32с, 2=16с, 3=64с

  # ================= Charger_CTL0 – 0x20 (стр. 5–6) =================
  # Биты 1:0: Настройка уровня остановки зарядки при полном заряде
  #   11: 4.2 / 4.305 / 4.35 / 4.395 В
  #   10: 4.185 / 4.29 / 4.335 / 4.38 В
  #   01: 4.17 / 4.275 / 4.32 / 4.365 В
  #   00: 4.14 / 4.26 / 4.305 / 4.35 В
  #   Дефолт: 10
  #   Примечание: "Рекомендуется использовать режимы 01 или 00 для наилучших результатов."
  charging_stop_voltage: 0   # 0..3; рекомендуется 0 или 1

  # ================= Charger_CTL1 – 0x21 (стр. 6) =================
  # Биты 7:6: Настройка обнаружения тока при остановке зарядки на стороне АКБ
  #   11: 600 мА
  #   10: 500 мА
  #   01: 400 мА
  #   00: 200 мА
  #   Дефолт: 01
  #   Примечание: "IP5306 сначала проверяет ток, а затем проверяет напряжение
  #   батареи при обнаружении полного заряда."
  end_charge_current: 1   # 0=200мА, 1=400мА, 2=500мА, 3=600мА

  # Биты 4:2: Настройка уровня недостаточного напряжения при зарядке (VOUT)
  #   111: 4.8 В    110: 4.75 В   101: 4.7 В    100: 4.65 В
  #   011: 4.6 В    010: 4.55 В   001: 4.5 В    000: 4.45 В
  #   Дефолт: 101 (4.7 В)
  #   Примечание: "Во время зарядки IC будет контролировать напряжение на выходе
  #   VOUT для автоматической регулировки зарядного тока. Когда напряжение VOUT
  #   превышает установленное значение, заряд будет осуществляться с максимальным
  #   током. Когда напряжение VOUT ниже установленного значения, зарядный ток
  #   будет автоматически уменьшаться, чтобы поддерживать это напряжение."
  charger_under_voltage: 5   # 0=4.45В … 7=4.8В, шаг 50мВ

  # ================= Charger_CTL2 – 0x22 (стр. 6–7) =================
  # Биты 3:2: Настройка уровня напряжения батареи
  #   11: 4.4 В
  #   10: 4.35 В
  #   01: 4.3 В
  #   00: 4.2 В
  #   Дефолт: 00
  battery_voltage: 0   # 0=4.2В, 1=4.3В, 2=4.35В, 3=4.4В

  # Биты 1:0: Настройка уровня дополнительного напряжения для постоянного
  #           напряжения зарядки
  #   11: +42 мВ
  #   10: +28 мВ
  #   01: +14 мВ
  #   00: без дополнительного напряжения
  #   Дефолт: 01
  #   Примечание: "Рекомендуется использовать дополнительное напряжение +14 мВ
  #   для уровней 4.30 В, 4.35 В и 4.4 В. Рекомендуется использовать
  #   дополнительное напряжение +28 мВ для уровня 4.2 В."
  voltage_pressure: 1   # 0=0мВ, 1=+14мВ, 2=+28мВ, 3=+42мВ

  # ================= Charger_CTL3 – 0x23 (стр. 7) =================
  # Бит 5: Выбор петли постоянного тока зарядки
  #   1: Петля постоянного тока на входе VIN (CC)
  #   0: Петля постоянного тока на батарее (BAT) (CC)
  #   Дефолт: 1
  cc_loop_vin: true

# 4. Чтение статусов через бинарные сенсоры
# Даташит (стр. 3): "Используйте бит 3 регистра с адресом 0x70 для определения
# состояния IP5306 (заряд или разряд): bit3=1 означает заряд, bit3=0 означает разряд."
# Однако в карте регистров (стр. 7) бит 3 регистра 0x70 — это charge_en
# (флаг разрешения зарядки), а не факт протекания тока.
# Даташит (стр. 3): "Используйте бит 3 регистра с адресом 0x71 для определения
# состояния заряда батареи: bit3=1 означает полный заряд, bit3=0 означает неполный заряд."
binary_sensor:
  # Регистр REG_READ0 – 0x70, бит 3: charge_en (флаг разрешения зарядки)
  #   1: Зарядка включена
  #   0: Зарядка выключена
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: charge_enabled
    name: "IP5306 Charge Enabled"

  # Регистр REG_READ1 – 0x71, бит 3: флаг полного заряда
  #   0: В процессе зарядки
  #   1: Полностью заряжено
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: charge_complete
    name: "IP5306 Charge Complete"

  # Регистр REG_READ2 – 0x72, бит 2: флаг лёгкой нагрузки на выходе
  #   0: Мощная нагрузка
  #   1: Лёгкая нагрузка
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: light_load
    name: "IP5306 Light Load"

  # Регистр REG_READ3 – 0x77, бит 0: флаг короткого нажатия на кнопку KEY
  #   1: Произведено короткое нажатие
  #   0: Нет короткого нажатия
  #   Тип: R/W. Сброс — "Write 1 Cleared" (записать 1 в бит).
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: short_press
    name: "IP5306 Short Press"

  # Регистр REG_READ3 – 0x77, бит 1: флаг длительного нажатия на кнопку KEY
  #   1: Произведено длительное нажатие
  #   0: Нет длительного нажатия
  #   Тип: R/W. Сброс — "Write 1 Cleared".
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: long_press
    name: "IP5306 Long Press"

  # Регистр REG_READ3 – 0x77, бит 2: флаг двойного нажатия на кнопку KEY
  #   1: Произведено двойное нажатие
  #   0: Нет двойного нажатия
  #   Тип: R/W. Сброс — "Write 1 Cleared".
  - platform: cg_charger_ip5306
    cg_charger_ip5306_id: cg_charger_ip
    sensor_type: double_press
    name: "IP5306 Double Press"

# 5. Уровень заряда (недокументированный регистр 0x78)
# В даташите CG Charger IP регистр 0x78 отсутствует (последний описанный — 0x77).
# Однако регистр стабильно работает и широко используется:
#   - ESP32Marauder: тот же маппинг & 0xF0
#   - AvinasheeTech/IP5306_I2C: список регистров
# Даташит (стр. 3) предупреждает: "IP5306 не имеет информации о напряжении и токе,
# поэтому для управления зарядом батареи необходимо использовать внешний
# контроллер с АЦП". Регистр 0x78 — исключение (дискретные уровни 25/50/75/100%).
sensor:
  - platform: template
    name: "IP5306 Battery Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    update_interval: 60s
    lambda: |-
      uint8_t level = id(cg_charger_ip).get_battery_level();
      if (level == 255) return NAN;
      return (float) level;
